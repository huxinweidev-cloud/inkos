name: Fork maintenance gate
on:
  push:
    branches: [master, inkos-integration, newapi-integration]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-maintenance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - name: Build and check Inkos
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
      - name: Test hosted changes when present
        run: |
          if test -f packages/core/src/__tests__/hosted-path-safety.test.ts; then
            pnpm --filter @actalk/inkos-core test src/__tests__/hosted-path-safety.test.ts src/__tests__/chapter-import-source.test.ts src/__tests__/translation-runner.test.ts
          fi
          if test -f packages/studio/src/__tests__/hosted-authorization.test.ts; then
            pnpm --filter @actalk/inkos-studio test src/__tests__/hosted-authorization.test.ts
          fi
          if test -f hosting/broker/package.json; then (cd hosting/broker && npm run check && npm test); fi
          if test -f hosting/worker/package.json; then (cd hosting/worker && INKOS_SOURCE_ROOT="$GITHUB_WORKSPACE" npm test); fi
